<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>powwow</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --green: #3fb950;
        --amber: #d29922;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app { display: flex; flex-direction: column; height: 100vh; }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      header .brand { font-weight: 700; letter-spacing: 0.5px; }
      header .brand span { color: var(--accent); }
      .participants { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        background: #0d1117;
      }
      .chip.driver { color: var(--green); border-color: var(--green); }
      .chip.you { box-shadow: inset 0 0 0 1px var(--accent); }
      .chip .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--muted);
      }
      .chip.driver .dot { background: var(--green); }
      .chip.waiting .dot { background: var(--amber); }
      .chip.typing.driver { box-shadow: 0 0 0 2px rgba(63,185,80,0.3); }
      .chip.typing:not(.driver) { color: var(--accent); border-color: var(--accent); }
      .chip.typing:not(.driver) .dot { background: var(--accent); }
      .typing-dots {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-left: 3px;
      }
      .typing-dots span {
        display: inline-block;
        width: 3px; height: 3px;
        border-radius: 50%;
        background: currentColor;
        animation: typing-bounce 1s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes typing-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      .controls { display: flex; gap: 8px; flex: 0 0 auto; }
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #21262d;
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); }
      #notice {
        flex: 0 0 auto;
        padding: 4px 14px;
        font-size: 12px;
        color: var(--muted);
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        min-height: 24px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #terminal { flex: 1 1 auto; padding: 6px; overflow: hidden; }
      #suggestionTray {
        flex: 0 0 auto;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 6px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 140px;
        overflow-y: auto;
      }
      .suggestion-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
      }
      .suggestion-from { color: var(--accent); flex: 0 0 auto; }
      .suggestion-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .suggestion-actions { display: flex; gap: 4px; flex: 0 0 auto; }
      .suggestion-actions button { padding: 3px 8px; font-size: 11px; }
      .btn-send { background: var(--green); border-color: var(--green); color: #0d1117; font-weight: 600; }
      .btn-send:hover:not(:disabled) { border-color: var(--green); opacity: 0.85; }
      #role {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 5px 14px;
        font-size: 12px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
      }
      #role b { color: var(--text); }
      #suggestArea { display: flex; gap: 6px; flex: 1; }
      #suggestText {
        flex: 1;
        padding: 4px 9px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        outline: none;
      }
      #suggestText:focus { border-color: var(--accent); }
      /* name overlay */
      #overlay {
        position: fixed; inset: 0;
        background: rgba(13, 17, 23, 0.92);
        display: flex; align-items: center; justify-content: center;
        z-index: 10;
      }
      #overlay .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 28px 30px;
        width: 320px;
        text-align: center;
      }
      #overlay h1 { margin: 0 0 4px; font-size: 20px; }
      #overlay h1 span { color: var(--accent); }
      #overlay p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
      #overlay input {
        width: 100%;
        padding: 9px 11px;
        margin-bottom: 14px;
        background: #0d1117;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
      }
      #overlay button { width: 100%; padding: 9px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">pow<span>wow</span></div>
        <div class="participants" id="participants"></div>
        <div class="controls">
          <button id="requestBtn">Request control</button>
          <button id="yieldBtn" class="primary" style="display:none">Yield control</button>
        </div>
      </header>
      <div id="notice">Connecting…</div>
      <div id="suggestionTray" style="display:none"></div>
      <div id="terminal"></div>
      <div id="role">
        <span>You are <b id="roleLabel">connecting…</b></span>
        <div id="suggestArea" style="display:none">
          <input id="suggestText" type="text" placeholder="Suggest a prompt for Claude…" maxlength="500" />
          <button id="suggestBtn">Suggest</button>
        </div>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1>pow<span>wow</span></h1>
        <p>Join the shared session. Pick a name your team will recognise.</p>
        <input id="nameInput" placeholder="Your name" maxlength="40" autofocus />
        <button id="joinBtn" class="primary">Join session</button>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
