<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>powwow — host</title>
    <style>
      :root {
        --bg:     #0d1117;
        --panel:  #161b22;
        --border: #30363d;
        --text:   #e6edf3;
        --muted:  #8b949e;
        --accent: #2f81f7;
        --green:  #3fb950;
        --amber:  #d29922;
        --purple: #a371f7;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px; line-height: 1.5;
      }
      #app { display: flex; flex-direction: column; height: 100vh; }

      /* header */
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 14px;
        background: var(--panel); border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .brand { font-weight: 700; font-size: 15px; letter-spacing: .4px; }
      .brand span { color: var(--accent); }
      .participants { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 9px; border-radius: 999px; font-size: 12px;
        border: 1px solid var(--border); color: var(--muted); background: var(--bg);
      }
      .chip.driver { color: var(--green); border-color: var(--green); }
      .chip.you    { box-shadow: inset 0 0 0 1px var(--accent); }
      .chip .dot   { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      .chip.driver .dot { background: var(--green); }
      .tag { font-size: 11px; color: var(--green); padding: 2px 6px;
             border: 1px solid var(--green); border-radius: 4px; }

      /* notice */
      #notice {
        padding: 5px 14px; font-size: 12px; color: var(--muted);
        background: var(--panel); border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }

      /* main content */
      #main {
        flex: 1; overflow-y: auto; padding: 24px 20px;
        display: flex; flex-direction: column; gap: 24px;
      }

      /* section */
      .section-title {
        font-size: 11px; font-weight: 600; letter-spacing: .5px;
        text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
      }

      /* suggestion queue */
      #suggestions-section { display: flex; flex-direction: column; }
      #suggestion-list { display: flex; flex-direction: column; gap: 8px; }
      .no-suggestions { font-size: 13px; color: var(--muted); padding: 10px 0; }
      .sugg-card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
      }
      .sugg-from { font-size: 12px; color: var(--purple); font-weight: 600; }
      .sugg-text { color: var(--text); font-size: 14px; }
      .sugg-actions { display: flex; gap: 8px; }
      button {
        font-family: inherit; font-size: 12px; font-weight: 600;
        padding: 6px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border); background: var(--panel); color: var(--text);
      }
      button:hover { opacity: .85; }
      .btn-copy {
        background: var(--green); border-color: var(--green); color: #0d1117;
      }
      .btn-dismiss { color: var(--muted); }

      /* share section */
      #share-section { display: flex; flex-direction: column; }
      .share-url-row {
        display: flex; gap: 8px; align-items: center;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 14px;
      }
      .share-url {
        flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        color: var(--accent); word-break: break-all;
      }
      .btn-copy-url { flex: 0 0 auto; }

      /* clipboard toast */
      #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--green); color: #0d1117; font-weight: 600; font-size: 13px;
        padding: 8px 18px; border-radius: 8px;
        opacity: 0; transition: opacity .2s; pointer-events: none;
      }
      #toast.show { opacity: 1; }

      /* join overlay */
      #overlay {
        position: fixed; inset: 0; background: rgba(13,17,23,.92);
        display: flex; align-items: center; justify-content: center; z-index: 10;
      }
      .join-box {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        padding: 32px 40px; display: flex; flex-direction: column; gap: 14px;
        min-width: 320px;
      }
      .join-box h2 { font-size: 17px; font-weight: 600; }
      .join-box p  { font-size: 13px; color: var(--muted); }
      input[type=text] {
        background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
        color: var(--text); font-size: 14px; padding: 8px 12px; outline: none; width: 100%;
        font-family: inherit;
      }
      input[type=text]:focus { border-color: var(--accent); }
      .btn-join {
        background: var(--accent); color: #fff; border-color: var(--accent); padding: 9px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">pow<span>wow</span></div>
        <div class="participants" id="participants"></div>
        <span class="tag">driving</span>
      </header>
      <div id="notice">Connecting…</div>
      <div id="main">
        <div id="suggestions-section">
          <div class="section-title">Teammate suggestions</div>
          <div id="suggestion-list">
            <div class="no-suggestions">No suggestions yet.</div>
          </div>
        </div>
        <div id="share-section">
          <div class="section-title">Share with teammates</div>
          <div class="share-url-row">
            <span class="share-url" id="share-url">—</span>
            <button class="btn-copy-url" id="copy-url-btn">Copy link</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast">Copied to clipboard ✓</div>

    <div id="overlay">
      <div class="join-box">
        <h2>pow<span style="color:#2f81f7">wow</span> host companion</h2>
        <p>You're the driver. This panel shows teammate suggestions — accept one to copy it to your clipboard, then paste into Claude.</p>
        <input type="text" id="name-input" placeholder="Your name" maxlength="40" />
        <button class="btn-join" id="join-btn">Open companion</button>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      var params  = new URLSearchParams(location.search);
      var token   = params.get("t") || "";
      var obsUrl  = params.get("obs") || "";
      var youId   = null;
      var ws      = null;
      var suggestions = [];
      var currentName = "";
      var reconnectAttempts = 0;
      var MAX_RECONNECT = 10;

      var overlay      = document.getElementById("overlay");
      var nameInput    = document.getElementById("name-input");
      var joinBtn      = document.getElementById("join-btn");
      var noticeEl     = document.getElementById("notice");
      var participantsEl = document.getElementById("participants");
      var suggListEl   = document.getElementById("suggestion-list");
      var shareUrlEl   = document.getElementById("share-url");
      var copyUrlBtn   = document.getElementById("copy-url-btn");
      var toast        = document.getElementById("toast");

      // Show observer URL
      if (obsUrl) shareUrlEl.textContent = obsUrl;

      var toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2000);
      }

      function copyToClipboard(text, label) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            showToast(label || "Copied to clipboard ✓");
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Copied ✓");
      }

      copyUrlBtn.addEventListener("click", function () {
        if (obsUrl) copyToClipboard(obsUrl, "Observer link copied ✓");
      });

      // ── presence ──────────────────────────────────────────────────────────
      function renderParticipants(list) {
        var seen = {};
        list.forEach(function (p) {
          seen[p.id] = true;
          var chip = participantsEl.querySelector('[data-pid="' + p.id + '"]');
          if (!chip) {
            chip = document.createElement("span");
            chip.dataset.pid = p.id;
            var dot = document.createElement("span");
            dot.className = "dot";
            var label = document.createElement("span");
            label.className = "chip-label";
            chip.appendChild(dot); chip.appendChild(label);
            participantsEl.appendChild(chip);
          }
          var cls = "chip";
          if (p.isDriver) cls += " driver";
          if (p.id === youId) cls += " you";
          chip.className = cls;
          var text = p.name + (p.id === youId ? " (you)" : "");
          if (p.isDriver) text += " · driving";
          chip.querySelector(".chip-label").textContent = text;
        });
        Array.from(participantsEl.querySelectorAll("[data-pid]")).forEach(function (chip) {
          if (!seen[chip.dataset.pid]) participantsEl.removeChild(chip);
        });
      }

      // ── suggestion list ───────────────────────────────────────────────────
      function renderSuggestions() {
        suggListEl.innerHTML = "";
        if (suggestions.length === 0) {
          var empty = document.createElement("div");
          empty.className = "no-suggestions";
          empty.textContent = "No suggestions yet.";
          suggListEl.appendChild(empty);
          return;
        }
        suggestions.forEach(function (s) {
          var card = document.createElement("div");
          card.className = "sugg-card";

          var from = document.createElement("div");
          from.className = "sugg-from";
          from.textContent = s.fromName;

          var text = document.createElement("div");
          text.className = "sugg-text";
          text.textContent = s.text;

          var actions = document.createElement("div");
          actions.className = "sugg-actions";

          var copyBtn = document.createElement("button");
          copyBtn.className = "btn-copy";
          copyBtn.textContent = "Copy to clipboard";
          (function (sid, stext) {
            copyBtn.onclick = function () {
              copyToClipboard(stext, "Copied — paste into Claude ✓");
              wsSend({ type: "accept_suggestion", id: sid });
            };
          })(s.id, s.text);

          var dismissBtn = document.createElement("button");
          dismissBtn.className = "btn-dismiss";
          dismissBtn.textContent = "Dismiss";
          (function (sid) {
            dismissBtn.onclick = function () {
              wsSend({ type: "dismiss_suggestion", id: sid });
            };
          })(s.id);

          actions.appendChild(copyBtn);
          actions.appendChild(dismissBtn);
          card.appendChild(from);
          card.appendChild(text);
          card.appendChild(actions);
          suggListEl.appendChild(card);
        });
      }

      // ── websocket ─────────────────────────────────────────────────────────
      function wsSend(obj) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
      }

      function connect(name) {
        var proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(proto + "://" + location.host + "/ws?t=" + encodeURIComponent(token));

        ws.onopen = function () {
          var hello = { type: "hello", name: name };
          var cid = sessionStorage.getItem("powwow_host_cid");
          if (cid) hello.clientId = cid;
          ws.send(JSON.stringify(hello));
        };

        ws.onmessage = function (ev) {
          var msg;
          try { msg = JSON.parse(ev.data); } catch { return; }

          switch (msg.type) {
            case "init":
              youId = msg.youId;
              suggestions = msg.suggestions || [];
              reconnectAttempts = 0;
              if (msg.clientId) sessionStorage.setItem("powwow_host_cid", msg.clientId);
              renderParticipants(msg.participants);
              renderSuggestions();
              noticeEl.textContent = "Connected — companion active.";
              break;
            case "presence":
              renderParticipants(msg.participants);
              break;
            case "notice":
              noticeEl.textContent = msg.text;
              break;
            case "suggestion":
              suggestions.push(msg.suggestion);
              renderSuggestions();
              break;
            case "suggestion_cleared":
              suggestions = suggestions.filter(function (s) { return s.id !== msg.id; });
              renderSuggestions();
              break;
            case "clipboard":
              // Server-side accept_suggestion in serve mode: copy text to clipboard
              copyToClipboard(msg.text, "Copied — paste into Claude ✓");
              break;
          }
        };

        ws.onclose = function () {
          if (reconnectAttempts < MAX_RECONNECT) {
            reconnectAttempts++;
            noticeEl.textContent = "Reconnecting… (" + reconnectAttempts + "/" + MAX_RECONNECT + ")";
            setTimeout(function () { connect(currentName); }, 1500);
          } else {
            noticeEl.textContent = "Disconnected.";
          }
        };

        ws.onerror = function () { noticeEl.textContent = "Connection error."; };
      }

      // ── join ──────────────────────────────────────────────────────────────
      function join() {
        var name = (nameInput.value || "").trim() || "driver";
        currentName = name;
        overlay.style.display = "none";
        connect(name);
      }

      joinBtn.addEventListener("click", join);
      nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
      nameInput.focus();
    })();
    </script>
  </body>
</html>
